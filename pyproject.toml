[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rome-py"
version = "0.0.1"
description = "Concomitant Huber regression with coordinate descent"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["robust-regression", "Huber", "coordinate-descent", "concomitant-scale"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "numba>=0.59", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/muellsen/rome-py"
Issues = "https://github.com/muellsen/rome-py/issues"

[project.optional-dependencies]
test = ["scipy>=1.10", "matplotlib>=3.7", "c-lasso==1.0.11"]
research = ["scipy>=1.10", "matplotlib>=3.7"]
benchmark = ["scipy>=1.10", "matplotlib>=3.7", "c-lasso==1.0.11"]

[tool.setuptools.packages.find]
where = ["src"]
